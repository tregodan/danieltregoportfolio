<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel Trego — Insert Disc</title>
  <style>
    :root { --ink:#171616; --paper:#e8e4d9; --red:#bc3f31; --muted:#847d71; --line:#4d4a43; }
    * { box-sizing:border-box; }
    :focus-visible { outline:3px solid #ffd45c; outline-offset:4px; }
    .skip-link { position:fixed; left:12px; top:12px; z-index:1000; transform:translateY(-180%); padding:10px 14px; color:#171616; background:#ffd45c; font-weight:700; text-decoration:none; }
    .skip-link:focus { transform:translateY(0); }
    body { margin:0; min-height:100vh; color:var(--paper); background:#161616; font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.03em; }
    .shell { width:min(1200px,92vw); margin:auto; padding:28px 0 48px; }
    .topline,.status { display:flex; justify-content:space-between; gap:18px; color:#b7b0a3; font-size:11px; text-transform:uppercase; }
    .brand { display:flex; justify-content:space-between; align-items:end; border-bottom:1px solid var(--line); padding:44px 0 22px; }
    h1 { margin:0; font:clamp(42px,8vw,100px)/.82 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif; letter-spacing:-.04em; }
    .prompt { color:var(--red); font-size:12px; text-align:right; }
    .prompt b { display:block; color:var(--paper); font-size:16px; margin-top:6px; }
    .site-nav { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
    .site-nav a { color:#b7b0a3; text-decoration:none; font-size:10px; border-bottom:1px solid #5d584e; padding-bottom:4px; }
    .site-nav a.active,.site-nav a:hover { color:var(--red); border-color:var(--red); }
    .stage { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr); gap:clamp(24px,4vw,44px); padding:34px 0; align-items:center; }
    .viewer { position:relative; isolation:isolate; background:linear-gradient(145deg,#c64d3d,#87251e 74%); border:1px solid #ef816d; padding:58px 22px 18px; border-radius:30px 30px 46px 46px; box-shadow:12px 14px 0 #0c0c0c, inset 0 2px 0 rgba(255,255,255,.18); }
    .viewer:before { content:""; }
    .disc-title { display:none; }
    .disc-mark,.disc-number { position:absolute; left:20%; right:20%; display:grid; place-items:center; z-index:3; color:#2d2a25; font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em; text-transform:uppercase; pointer-events:none; }
    .disc-mark { top:34%; height:12px; }.disc-number { top:57%; height:14px; }
    .window { aspect-ratio:var(--frame-ratio,1.5); margin-top:18px; overflow:hidden; background:#111; position:relative; border:7px solid #45110e; border-radius:24px 24px 36px 36px; box-shadow:0 4px 0 rgba(255,255,255,.12), inset 0 0 0 2px #120605; }
    .window img { width:100%; height:100%; object-fit:contain; display:block; background:#111; filter:saturate(.72) contrast(1.05); transition:opacity .18s, transform .18s; user-select:none; -webkit-user-drag:none; pointer-events:none; }
    .window img.fade { opacity:.25; transform:scale(1.03); }
    .window:after { content:""; position:absolute; inset:0; border:12px solid rgba(0,0,0,.22); pointer-events:none; }
    .controls { position:relative; display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding-top:18px; color:#ffd0c3; font-size:11px; }
    .control-left,.control-right { display:flex; gap:8px; align-items:center; }
    .control-right { justify-content:flex-end; }
    .controls #counter { text-align:center; white-space:nowrap; }
    button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
    .arrow { border:0; border-radius:4px; padding:12px 17px; color:var(--button-text,#fff); background:var(--inside-border,#3f6270); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 3px 3px 0 #0c0c0c; }
    .arrow:hover { filter:brightness(1.2); transform:translateY(-1px); }
    .info { align-self:stretch; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
    .kicker { color:var(--red); font-size:11px; margin-bottom:10px; }
    h2 { margin:0 0 12px; font-size:clamp(23px,3vw,38px); line-height:1; letter-spacing:-.06em; }
    .info p { color:#b7b0a3; max-width:34em; margin-left:auto; margin-right:auto; }
    .meta { border-top:1px solid var(--line); margin-top:20px; padding-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; color:#827b70; font-size:11px; }
    .meta strong { display:block; color:var(--paper); font-weight:normal; margin-top:4px; }
    .analog-meta { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; color:#d1c9bb; letter-spacing:.12em; }
    .discs { border-top:1px solid var(--line); padding-top:22px; min-height:235px; }
    .section-label { display:flex; justify-content:space-between; color:#857e73; font-size:11px; margin-bottom:18px; }
    .pack-picker { display:flex; flex-wrap:wrap; gap:10px; margin:-4px 0 20px; }
    .pack-button { display:inline-flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid #605b51; border-radius:4px; color:#b7b0a3; background:#202020; box-shadow:2px 2px 0 #080808; cursor:pointer; font-size:10px; text-transform:uppercase; }
    .pack-button:hover,.pack-button[aria-pressed="true"] { color:#171616; background:#e8e4d9; border-color:#e8e4d9; }
    .pack-icon { display:inline-block; width:18px; height:18px; border:2px solid currentColor; border-radius:50%; position:relative; }
    .pack-icon:before,.pack-icon:after { content:""; position:absolute; inset:2px; border:1px solid currentColor; border-radius:50%; }
    .pack-icon:before { transform:translate(3px,2px); }.pack-icon:after { transform:translate(-3px,-2px); }
    .disc-shelf { display:block; }
    .disc-row { display:flex; align-items:flex-start; gap:28px; overflow-x:auto; padding:18px 12px 28px; min-height:185px; }
    .disc { flex:0 0 160px; text-align:center; padding:0 0 10px; border:0; border-bottom:1px solid transparent; }
    .disc-art { display:block; width:150px; aspect-ratio:1; margin:auto; overflow:hidden; border-radius:50%; border:2px solid #b9b8b1; position:relative; background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.75),transparent 30%),linear-gradient(145deg,#fffefa,#deded7 72%,#c5c5be); box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 0 0 0 5px rgba(80,80,72,.2),4px 5px 0 #0c0c0c; transition:transform .25s; }
    .disc-art:before { content:none; }
    .disc-art:after { content:""; position:absolute; width:10px; height:10px; left:calc(50% - 5px); top:calc(50% - 5px); border-radius:50%; background:#1d1d1a; box-shadow:0 0 0 2px #c7c7c0; z-index:2; }
    .disc-notch { position:absolute; width:8px; height:17px; border-radius:2px; background:#171717; box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); transform:translate(-50%,-50%); z-index:3; }
    .disc:hover .disc-art,.disc:focus-visible .disc-art { transform:scale(1.08); }
    .disc.active .disc-art { transform:rotate(var(--reel-rotation,0deg)); z-index:4; border-color:#fff; box-shadow:inset 0 0 0 2px #252525, inset 0 0 0 5px #eeeae1, 0 0 0 3px var(--selected-disc-color,#b63d31), 4px 5px 0 #0c0c0c; }
    .slot { position:absolute; width:28px; height:22px; border:2px solid #171717; border-radius:6px; background-size:cover; background-position:center; transform:translate(-50%,-50%) rotate(var(--slot-angle,0deg)); z-index:2; box-shadow:0 1px 1px #4b473f, inset 0 0 0 1px rgba(0,0,0,.28); filter:saturate(.7) brightness(.65); cursor:pointer; }
    .disc[data-orientation="portrait"] .slot { width:22px; height:28px; }
    .disc[data-orientation="square"] .slot { width:25px; height:25px; }
    .slot.current { outline:2px solid var(--red); outline-offset:2px; }
    .disc-label { display:block; margin-top:14px; font-size:11px; color:#c4bdae; }
    .disc small { display:block; color:#c4bdae; margin-top:10px; font-size:13px; letter-spacing:-.03em; }
    .disc-nav { border:0; border-radius:4px; padding:12px 17px; color:var(--button-text,#fff); background:var(--inside-border,#3f6270); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 3px 3px 0 #0c0c0c; cursor:pointer; font-size:11px; white-space:nowrap; }
    .disc-nav:hover { filter:brightness(1.2); transform:translateY(-1px); }
    .footer { margin-top:30px; display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:14px; color:#756f65; font-size:10px; }
    .lever { position:absolute; right:-52px; top:24%; width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffc451,#e47e16 65%,#a94c0d); border:2px solid #ffbd55; box-shadow:5px 6px 0 #0c0c0c, inset 2px 2px 0 rgba(255,255,255,.35); cursor:pointer; transform-origin:left center; transition:transform .2s; z-index:4; }
    .lever:before { content:""; position:absolute; left:-18px; top:22px; width:22px; height:14px; border-radius:8px 0 0 8px; background:#df7d19; box-shadow:inset 0 2px 1px rgba(255,255,255,.25); z-index:-1; }
    .lever:after { content:""; position:absolute; left:16px; top:17px; width:22px; height:22px; border-radius:50%; border:2px solid rgba(126,60,10,.35); }
    .lever.pulled { transform:translateX(27px) rotate(18deg); }
    .viewer-tools { position:absolute; right:24px; top:12px; z-index:4; display:flex; align-items:center; gap:8px; }
    .viewer-tools button { color:#ffd0c3; font-size:10px; border:1px solid rgba(255,220,210,.45); padding:6px 8px; }
    .viewer-tools .swatch { width:18px; height:18px; padding:0; border-radius:50%; }
    .swatch.red { background:#b63d31; }.swatch.black { background:#181818; }.swatch.blue { background:#2e6478; }.swatch.white { background:#a9a9a3; border:1px solid #888; }
    #fullscreen { position:absolute; left:24px; top:12px; border:0; border-radius:4px; padding:12px 17px; color:var(--button-text,#fff); background:var(--inside-border,#3f6270); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 3px 3px 0 #0c0c0c; }
    #fullscreen:hover { filter:brightness(1.2); transform:translateY(-1px); }
    .viewer[data-color="red"] { --inside-border:#3e6b79; --button-text:#fff; }
    .viewer[data-color="blue"] { background:linear-gradient(145deg,#3e7f91,#17424f 74%); border-color:#81bcc9; --inside-border:#45110e; --button-text:#fff; }
    .viewer[data-color="black"] { background:linear-gradient(145deg,#3b3b3b,#111 74%); border-color:#858585; --inside-border:#f3f0e8; --button-text:#171717; }
    .viewer[data-color="white"] { background:linear-gradient(145deg,#c9c9c3,#979791 74%); border-color:#e2e2dc; --inside-border:#171717; --button-text:#fff; }
    .viewer[data-color="red"] .window { border-color:#3e6b79; }
    .viewer[data-color="blue"] .window { border-color:#45110e; }
    .viewer[data-color="black"] .window { border-color:#f3f0e8; }
    .viewer[data-color="white"] .window { border-color:#171717; }
    .viewer:fullscreen { width:100vw; height:100vh; max-height:none; margin:0; padding:48px 3vw 14px; border-radius:0; overflow:visible; display:flex; flex-direction:column; justify-content:center; }
    .viewer:fullscreen .window { flex:0 0 auto; width:var(--window-width,100%); height:var(--window-height,auto); max-width:100%; max-height:calc(100vh - 120px); aspect-ratio:auto; align-self:center; }
    .viewer:fullscreen .controls { flex:0 0 auto; padding:12px 10px 0; }
    .viewer:fullscreen .lever { right:18px; }
    .viewer:fullscreen .viewer-tools { position:absolute; top:24px; right:32px; z-index:100; pointer-events:auto; }
    .viewer:fullscreen .viewer-tools .swatch { position:relative; z-index:101; pointer-events:auto; cursor:pointer; }
    .viewer:fullscreen #fullscreen { position:absolute; top:24px; left:32px; z-index:100; pointer-events:auto; cursor:pointer; }
    .viewer[data-orientation="portrait"] .window { width:min(100%,560px); aspect-ratio:var(--frame-ratio,4 / 5); margin-left:auto; margin-right:auto; }
    .viewer[data-orientation="square"] .window { width:min(100%,680px); aspect-ratio:var(--frame-ratio,1); margin-left:auto; margin-right:auto; }
    .viewer[data-orientation="portrait"] .controls,.viewer[data-orientation="square"] .controls { padding-top:18px; }
    @media (max-width:900px) {
      .shell { width:min(100% - 32px,720px); }
      .stage { grid-template-columns:1fr; gap:28px; padding:28px 0; }
      .info { order:2; align-items:stretch; text-align:left; }
      .info p { max-width:none; }
      .meta { width:100%; }
      .viewer { width:100%; }
    }
    @media (max-width:600px) {
      body { font-size:13px; }
      .shell { width:calc(100% - 24px); padding:16px 0 32px; }
      .brand { align-items:flex-start; flex-direction:column; gap:18px; padding:28px 0 18px; }
      h1 { font-size:clamp(48px,18vw,78px); }
      .prompt { width:100%; text-align:left; }
      .prompt b { font-size:14px; }
      .site-nav { justify-content:flex-start; }
      .viewer { padding:54px 12px 14px; border-radius:22px 22px 32px 32px; }
      .viewer-tools { right:14px; top:12px; gap:6px; }
      #fullscreen { left:14px; top:10px; padding:10px 12px; font-size:11px; }
      .viewer:fullscreen { padding:42px 10px 10px; }
      .viewer:fullscreen .window { flex:1 1 auto; max-height:none; }
      .window { margin-top:12px; border-width:5px; border-radius:16px 16px 24px 24px; }
      .viewer[data-orientation="portrait"] .window { width:78%; }
      .viewer[data-orientation="square"] .window { width:100%; }
      .window:after { border-width:7px; }
      .controls { grid-template-columns:1fr auto 1fr; gap:8px; padding-top:14px; align-items:end; }
      .control-left,.control-right { display:grid; grid-template-columns:1fr; gap:8px; }
      .control-left #prev { order:1; }
      .control-left #prevDisc { order:2; }
      .control-right #next { order:1; }
      .control-right #nextDisc { order:2; }
      .controls #counter { order:initial; align-self:center; }
      .arrow,.disc-nav { padding:10px 11px; font-size:10px; }
      .lever { right:-12px; top:36%; width:48px; height:48px; }
      .lever:before { left:-16px; top:18px; width:19px; height:12px; }
      .lever:after { left:13px; top:14px; width:18px; height:18px; }
      .discs { min-height:0; padding-top:18px; }
      .disc-row { gap:16px; padding:12px 6px 20px; }
      .disc { flex-basis:132px; }
      .disc-art { width:124px; }
      .footer { flex-direction:column; gap:8px; }
      .viewer:fullscreen { padding:64px 18px 20px; }
      .viewer:fullscreen .viewer-tools { right:18px; }
      .viewer:fullscreen #fullscreen { left:18px; }
      .viewer:fullscreen .lever { right:4px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="shell" id="main-content">
    <header class="brand"><h1>DANIEL<br>TREGO</h1><div class="prompt">PHOTO PORTFOLIO // INSERT DISC<b>FRAME BY FRAME. STORY BY STORY.</b><nav class="site-nav" aria-label="Primary navigation"><a class="active" aria-current="page" href="viewmaster-prototype.html">DISC VIEWER</a><a href="high-scores.html">HIGH SCORES</a></nav></div></header>
    <section class="stage" aria-label="View-Master portfolio viewer">
      <div class="viewer" id="viewer" data-color="red" aria-label="View-Master viewer"><div class="viewer-tools" aria-label="Viewer color"><button type="button" class="swatch red" data-color="red" aria-label="Red viewer"></button><button type="button" class="swatch black" data-color="black" aria-label="Black viewer"></button><button type="button" class="swatch blue" data-color="blue" aria-label="Blue viewer"></button><button type="button" class="swatch white" data-color="white" aria-label="Gray viewer"></button></div><button type="button" id="fullscreen">FULLSCREEN</button><div class="window"><img id="hero" alt="" /></div><button type="button" class="lever" id="lever" aria-label="Advance to the next image"></button><div class="controls" aria-label="Viewer controls"><div class="control-left"><button type="button" class="arrow" id="prev">← PREV IMAGE</button><button type="button" class="disc-nav" id="prevDisc">← DISC</button></div><span id="counter" aria-live="polite">01 - 01/07</span><div class="control-right"><button type="button" class="disc-nav" id="nextDisc">DISC →</button><button type="button" class="arrow" id="next">NEXT IMAGE →</button></div></div></div>
      <aside class="info" aria-labelledby="title"><div class="kicker" id="code">DISC_01 / SERIES_A</div><h2 id="title">Night Studies</h2><p id="description"></p><div class="meta"><div id="locationMeta">LOCATION<strong id="location"></strong></div><div id="formatMeta">FORMAT<strong id="format"></strong></div><div id="captionMeta">CAPTION<strong id="caption"></strong></div><div id="dateMeta">DATE<strong id="date"></strong></div></div><div class="analog-meta" id="analog" aria-label="Camera settings"></div></aside>
    </section>
    <section class="discs" aria-labelledby="disc-heading"><div class="section-label"><span id="pack-heading">SELECT A PACK</span></div><div class="pack-picker" id="packs" role="group" aria-labelledby="pack-heading"></div><div class="section-label"><span id="disc-heading">SELECT A DISC</span></div><div class="disc-shelf"><div class="disc-row" id="discs" role="list" aria-labelledby="disc-heading"></div></div></section>
    <footer class="footer"><span>© DANIEL TREGO</span><span>INSTAGRAM /TREGODAN</span><span>CONTACT // EJECT</span></footer>
  </main>
  <script>
      const fallbackCollections = [
      {id:'DISC_01', title:'Night Studies', location:'Detroit, MI', description:'Artificial light, empty streets, and late-hour movement. A small archive of the city after closing.', images:['https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1514924013411-cbf25faa35bb?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1200&q=85'], captions:['After closing','Downtown, 22:41','Last light','Northbound','Underpass','One more mile','Green room']},
      {id:'DISC_02', title:'Soft Errors', location:'Various / 2024–26', description:'Small glitches in familiar places: color, memory, and the quiet evidence of a day out of sequence.', images:['https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1524230572899-a752b3835840?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1200&q=85'], captions:['Desk light','Empty office','Blue hour','Open road','Found object','Soft focus','Exit sign']},
      {id:'DISC_03', title:'Field Notes', location:'Michigan / 2023–25', description:'A slower collection of edges, weather, and the things that hold still long enough to be noticed.', images:['https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1473445361085-b9a07f55608b?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=85'], captions:['Field edge','Low canopy','After rain','Tall grass','North line','Open water','Last frame']}
    ];
    const archiveNames=['Transit','Rooms','Weather','People','Edges','Signals','Sunday','Archive','Blue Hour'];
    function normalizeCollections(source,fillArchive=false){ const list=source.map((c,i)=>{const frames=(c.images||[]).map(image=>typeof image==='string'?{src:image}:image); const images=frames.map(image=>image.src||''); const captions=c.captions||frames.map(image=>image.caption||''); return {...c,pack:c.pack||['night-studies','soft-errors','field-notes'][i%3],frames,images,captions};}); if(fillArchive){ while(list.length<12){ const base=list[(list.length-3)%3]||list[0]; const n=list.length+1; list.push({...base,id:'DISC_'+String(n).padStart(2,'0'),title:archiveNames[n-4]||('Series '+n)}); } } list.forEach((c,i)=>c.date=c.date||String(2023+(i%4))); return list; }
    function canonicalDiscId(id){ return String(id||'').toUpperCase().replace(/^DISC_0*/, 'DISC_'); }
    function alignPackMembership(){ const membership={}; packs.forEach(pack=>(pack.discs||[]).forEach(id=>membership[canonicalDiscId(id)]=pack.id)); collections.forEach(c=>{if(membership[canonicalDiscId(c.id)])c.pack=membership[canonicalDiscId(c.id)]}); }
    let collections=normalizeCollections(fallbackCollections,true), packs=[], activePack='ALL';
    function normalizePacks(source){ return (source&&source.length?source:[{id:'night-studies',title:'Night Studies',category:'PHOTO',discs:['DISC_01']},{id:'soft-errors',title:'Soft Errors',category:'PHOTO',discs:['DISC_02']},{id:'field-notes',title:'Field Notes',category:'PHOTO',discs:['DISC_03']}]).map(pack=>({...pack,discs:pack.discs||[]})); }
    function visibleCollections(){ return activePack==='ALL'?collections:collections.filter(c=>c.pack===activePack); }
    let collection=collections[0], frame=0;
    const $=s=>document.querySelector(s);
    const viewerAccent={red:'#b63d31',black:'#181818',blue:'#2e6478',white:'#a9a9a3'};
    function syncDiscAccent(){document.documentElement.style.setProperty('--selected-disc-color',viewerAccent[$('#viewer').dataset.color]||viewerAccent.red);}
    function slotsMarkup(c){ return c.images.map((src,j)=>{const angle=(j/7)*Math.PI*2-Math.PI/2; const angleDeg=(j/7)*360-90; const x=50+38*Math.cos(angle), y=50+38*Math.sin(angle); const current=c===collection&&j===frame?' current':''; return '<span class="slot'+current+'" style="left:'+x+'%;top:'+y+'%;--slot-angle:'+(angleDeg+90)+'deg;background-image:url(\''+src+'\')"></span>';}).join(''); }
    function notchMarkup(){ const step=360/7; return Array.from({length:7},(_,i)=>{const angle=(i+0.5)*step-90; const r=47; const x=50+r*Math.cos(angle*Math.PI/180), y=50+r*Math.sin(angle*Math.PI/180); return '<i class="disc-notch" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) rotate('+(angle+90)+'deg)"></i>';}).join(''); }
    function setMeta(id,value){const node=$('#'+id+'Meta'); $('#'+id).textContent=value||''; node.hidden=!value;}
    function fitWindow(){const viewer=$('#viewer'),windowEl=document.querySelector('.window'),hero=$('#hero'); if(!viewer||!windowEl)return; const ratio=hero.naturalWidth&&hero.naturalHeight?hero.naturalWidth/hero.naturalHeight:(parseFloat(getComputedStyle(windowEl).getPropertyValue('--frame-ratio'))||1.5); const full=Boolean(document.fullscreenElement); const maxWidth=Math.max(220,(viewer.clientWidth-(full?36:44))); const maxHeight=full?Math.max(220,viewer.clientHeight-118):Math.max(220,Math.min(window.innerHeight*.64,680)); let width=maxWidth,height=width/ratio; if(height>maxHeight){height=maxHeight;width=height*ratio;} windowEl.style.width=Math.round(width)+'px'; windowEl.style.height=Math.round(height)+'px'; windowEl.style.aspectRatio='auto'; windowEl.style.setProperty('--frame-ratio',ratio); windowEl.style.setProperty('--window-width',Math.round(width)+'px'); windowEl.style.setProperty('--window-height',Math.round(height)+'px');}
    function render(){ const viewer=$('#viewer'),hero=$('#hero'),windowEl=document.querySelector('.window'); viewer.dataset.orientation=collection.orientation||'landscape'; hero.onload=()=>{const ratio=hero.naturalWidth&&hero.naturalHeight?hero.naturalWidth/hero.naturalHeight:1.5; windowEl.style.setProperty('--frame-ratio',ratio); viewer.dataset.orientation=ratio<.88?'portrait':ratio>1.14?'landscape':'square'; fitWindow();}; hero.classList.add('fade'); setTimeout(()=>{ hero.src=collection.images[frame]; hero.alt=collection.captions[frame]||''; if(hero.complete)hero.onload(); hero.classList.remove('fade'); },120); const discNumber=String(collections.indexOf(collection)+1).padStart(2,'0'); const image=collection.frames?.[frame]||{}; $('#code').textContent=collection.id+' / SERIES_'+discNumber; $('#title').textContent=collection.title||''; $('#description').textContent=collection.description||''; setMeta('location',collection.location); setMeta('format',collection.format); setMeta('caption',collection.captions[frame]); setMeta('date',image.date||collection.date); const settings=[image.iso&&'ISO '+image.iso,image.aperture&&'f/'+image.aperture,image.shutter&&image.shutter].filter(Boolean).join('   '); $('#analog').textContent=settings; $('#analog').hidden=!settings; $('#counter').textContent=discNumber+' - '+String(frame+1).padStart(2,'0')+'/'+String(collection.images.length).padStart(2,'0'); document.querySelectorAll('.disc').forEach(d=>{const active=d.dataset.discId===collection.id; d.classList.toggle('active',active); d.querySelectorAll('.slot').forEach((slot,j)=>slot.classList.toggle('current',active && j===frame)); const art=d.querySelector('.disc-art'); const rotation=active?-frame*(360/collection.images.length):0; art.style.setProperty('--reel-rotation',rotation+'deg');}); }
    function buildPacks(){ const holder=$('#packs'); holder.innerHTML=''; const all=document.createElement('button'); all.type='button'; all.className='pack-button'; all.setAttribute('aria-pressed',String(activePack==='ALL')); all.innerHTML='<span class="pack-icon" aria-hidden="true"></span><span>ALL PACKS</span>'; all.onclick=()=>{activePack='ALL';collection=collections[0];frame=0;buildPacks();buildDiscs();render()}; holder.append(all); packs.forEach(pack=>{const button=document.createElement('button');button.type='button';button.className='pack-button';button.setAttribute('aria-pressed',String(activePack===pack.id));button.innerHTML='<span class="pack-icon" aria-hidden="true"></span><span>'+pack.title+'</span>';button.onclick=()=>{activePack=pack.id;const next=visibleCollections()[0];if(next){collection=next;frame=0}buildPacks();buildDiscs();render()};holder.append(button)}); }
    function buildDiscs(){ $('#discs').innerHTML=''; visibleCollections().forEach(c=>{ const b=document.createElement('div'); b.className='disc'; b.dataset.discId=c.id; b.dataset.orientation=c.orientation||'landscape'; b.setAttribute('role','listitem'); b.tabIndex=0; b.setAttribute('aria-label','Insert '+c.id+', '+c.title); b.innerHTML='<span class="disc-art"><span class="disc-mark" aria-hidden="true">DISC</span><span class="disc-number" aria-hidden="true">'+String(collections.indexOf(c)+1).padStart(2,'0')+'</span>'+slotsMarkup(c)+notchMarkup()+'</span><small>'+c.title+'</small>'; const selectDisc=()=>{collection=c;frame=0;render()}; b.onclick=selectDisc; b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectDisc()}}; b.querySelectorAll('.slot').forEach((slot,j)=>{slot.setAttribute('role','button');slot.tabIndex=0;slot.setAttribute('aria-label','View '+c.title+', frame '+(j+1)+': '+(c.captions[j]||'')); const selectFrame=e=>{e.stopPropagation();collection=c;frame=j;render()}; slot.onclick=selectFrame; slot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFrame(e)}}}); $('#discs').append(b); }); }
    packs=normalizePacks([]); buildPacks(); buildDiscs();
    function advance(){ $('#lever').classList.add('pulled'); setTimeout(()=>$('#lever').classList.remove('pulled'),180); frame=(frame+1)%collection.images.length; render(); }
    function changeDisc(delta){const list=visibleCollections();const index=(list.indexOf(collection)+delta+list.length)%list.length; collection=list[index]; frame=0; render();}
    $('#prev').onclick=()=>{frame=(frame+collection.images.length-1)%collection.images.length;render()}; $('#next').onclick=advance; $('#lever').onclick=advance; $('#prevDisc').onclick=()=>changeDisc(-1); $('#nextDisc').onclick=()=>changeDisc(1); $('#viewer').addEventListener('click',event=>{const button=event.target.closest('.swatch'); if(!button)return; event.preventDefault(); event.stopPropagation(); $('#viewer').dataset.color=button.dataset.color; syncDiscAccent();}); $('#fullscreen').onclick=async()=>{if(!document.fullscreenElement){try{await $('#viewer').requestFullscreen?.(); await screen.orientation?.lock?.('landscape').catch(()=>{});}catch(error){/* Fullscreen is unavailable in some mobile browsers. */}}else{document.exitFullscreen?.();}}; document.addEventListener('fullscreenchange',()=>{ $('#fullscreen').textContent=document.fullscreenElement?'MINIMIZE':'FULLSCREEN'; if(!document.fullscreenElement)screen.orientation?.unlock?.(); setTimeout(fitWindow,80); }); window.addEventListener('resize',fitWindow); document.addEventListener('contextmenu',event=>{if(event.target.closest('img,.slot'))event.preventDefault();}); document.addEventListener('dragstart',event=>{if(event.target.closest('img,.slot'))event.preventDefault();}); document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#prev').click(); if(e.key==='ArrowRight' || e.key===' ') {e.preventDefault(); advance();}}); syncDiscAccent(); render(); fetch('content/portfolio.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('content unavailable');return response.json()}).then(data=>{packs=normalizePacks(data.packs);collections=normalizeCollections(data.discs||[],false);alignPackMembership();collection=collections[0]||collection;activePack='ALL';frame=0;buildPacks();buildDiscs();render()}).catch(()=>{});
  </script>
