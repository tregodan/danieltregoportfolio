media:
  input: media
  output: /media
  categories: [image]

content:
  - name: portfolio
    label: Portfolio
    type: file
    path: content/portfolio.json
    fields:
      - name: packs
        label: Disc Packs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: Pack ID
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: category
            label: Category
            type: select
            options:
              values: [PHOTO, DESIGN, WEB, TEACH, RESEARCH, OTHER]
          - name: description
            label: Description
            type: text
          - name: discs
            label: Disc IDs
            type: string
            list: true
      - name: discs
        label: Discs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{id} — {title}"
        fields:
          - name: id
            label: Disc ID
            type: string
            required: true
          - name: pack
            label: Pack ID
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: volume
            label: Volume
            type: number
          - name: location
            label: Location
            type: string
          - name: format
            label: Format
            type: string
          - name: date
            label: Date
            type: string
          - name: description
            label: Description
            type: text
          - name: images
            label: Frames
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Frame {index}: {caption}"
            fields:
              - name: src
                label: Image
                type: image
              - name: caption
                label: Caption
                type: string
              - name: date
                label: Date
                type: string
              - name: location
                label: Location
                type: string
              - name: iso
                label: ISO
                type: string
              - name: aperture
                label: Aperture
                type: string
              - name: shutter
                label: Shutter speed
                type: string

  - name: high-scores
    label: High Scores
    type: file
    path: content/high-scores.json
    fields:
      - name: entries
        label: High Score Entries
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {category}"
        fields:
          - name: name
            label: Title
            type: string
            required: true
          - name: category
            label: Category
            type: select
            options:
              values: [PHOTO, DESIGN, WEB, TEACH, RESEARCH, OTHER]
          - name: year
            label: Date or year
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: External link (optional)
            type: string
