# GitHub Pages deploys occasionally fail on GitHub's side ("Deployment failed,
# try again later"). This re-runs a failed deploy once, automatically.
name: Retry failed Pages deploy

on:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait a moment, then re-run the failed deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
