<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Trego — Coming Soon</title>
<meta name="description" content="Daniel Trego — photography portfolio coming soon.">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XMJC8R8K4Q"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);} 
  gtag('js', new Date());
  gtag('config', 'G-XMJC8R8K4Q');
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --ink: #171717;
    --paper: #f4efe3;
    --shadow: #cfc5b2;
    --accent: #e56b4a;
    --green: #6b8f71;
    --blue: #6d8ca8;
    --yellow: #efc45a;
  }

  * { box-sizing: border-box; }

  html, body { width: 100%; height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Press Start 2P', monospace;
    image-rendering: pixelated;
    overflow: hidden;
  }

  .screen {
    min-height: 100dvh;
    position: relative;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      linear-gradient(rgba(23,23,23,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,23,23,.035) 1px, transparent 1px),
      var(--paper);
    background-size: 16px 16px;
  }

  .screen::before,
  .screen::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 8px;
    background: var(--ink);
  }

  .screen::before { top: 0; }
  .screen::after { bottom: 0; }

  .corner {
    position: absolute;
    font-size: 9px;
    line-height: 1.5;
    opacity: .8;
  }
  .corner.tl { top: 30px; left: 30px; }
  .corner.tr { top: 30px; right: 30px; text-align: right; }
  .corner.bl { bottom: 28px; left: 30px; }
  .corner.br { bottom: 28px; right: 30px; text-align: right; }

  .card {
    width: min(980px, 100%);
    display: grid;
    grid-template-columns: 1fr .95fr;
    gap: 36px;
    align-items: center;
    padding: clamp(20px, 5vw, 54px);
    background: rgba(244,239,227,.92);
    border: 8px solid var(--ink);
    box-shadow: 12px 12px 0 var(--ink), 20px 20px 0 var(--shadow);
  }

  .copy { position: relative; z-index: 2; }

  .eyebrow {
    display: inline-block;
    padding: 9px 10px 7px;
    margin-bottom: 22px;
    background: var(--accent);
    color: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    font-size: 10px;
    letter-spacing: 1px;
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 64px);
    line-height: 1.18;
    letter-spacing: -2px;
    text-transform: uppercase;
    text-shadow: 5px 5px 0 var(--yellow);
  }

  .sub {
    max-width: 520px;
    margin: 22px 0 28px;
    font-size: 12px;
    line-height: 2;
  }

  .instagram {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px 11px;
    color: var(--paper);
    background: var(--ink);
    border: 4px solid var(--ink);
    text-decoration: none;
    font-size: 10px;
    box-shadow: 6px 6px 0 var(--accent);
    transition: transform .12s steps(2), box-shadow .12s steps(2);
  }

  .instagram:hover,
  .instagram:focus-visible {
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0 var(--accent);
    outline: none;
  }

  .ig-mark {
    width: 18px;
    height: 18px;
    border: 3px solid var(--paper);
    position: relative;
  }
  .ig-mark::before {
    content: "";
    width: 6px;
    height: 6px;
    border: 2px solid var(--paper);
    position: absolute;
    left: 3px;
    top: 3px;
  }
  .ig-mark::after {
    content: "";
    width: 3px;
    height: 3px;
    background: var(--paper);
    position: absolute;
    right: 1px;
    top: 1px;
  }

  .camera-stage {
    min-height: 340px;
    display: grid;
    place-items: center;
    position: relative;
  }

  /* CSS pixel-art camera */
  .camera {
    width: min(340px, 80vw);
    height: 230px;
    position: relative;
    filter: drop-shadow(10px 10px 0 var(--ink));
  }

  .camera-body {
    position: absolute;
    left: 8%;
    right: 4%;
    bottom: 10%;
    height: 62%;
    background: var(--blue);
    border: 8px solid var(--ink);
  }

  .camera-body::before,
  .camera-body::after {
    content: "";
    position: absolute;
    background: var(--paper);
    border: 5px solid var(--ink);
  }

  .camera-body::before {
    width: 22px;
    height: 22px;
    left: 13px;
    top: 18px;
  }

  .camera-body::after {
    width: 14px;
    height: 14px;
    right: 14px;
    top: 22px;
    background: var(--yellow);
  }

  .top {
    position: absolute;
    left: 21%;
    top: 9%;
    width: 40%;
    height: 22%;
    background: var(--blue);
    border: 8px solid var(--ink);
    border-bottom: 0;
  }

  .shutter {
    position: absolute;
    right: 14%;
    top: 15%;
    width: 13%;
    height: 11%;
    background: var(--yellow);
    border: 6px solid var(--ink);
  }

  .lens {
    position: absolute;
    width: 126px;
    height: 126px;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    background: var(--ink);
    border: 8px solid var(--ink);
    box-shadow: inset 0 0 0 10px var(--paper), inset 0 0 0 18px var(--green);
  }

  .lens::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 50px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--blue);
    border: 8px solid var(--ink);
  }

  .lens::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    left: 39px;
    top: 24px;
    background: var(--paper);
  }

  .film {
    position: absolute;
    width: 230px;
    height: 54px;
    left: 50%;
    bottom: -2px;
    transform: translateX(-50%) rotate(-4deg);
    background: var(--paper);
    border: 6px solid var(--ink);
    display: flex;
    gap: 10px;
    padding: 7px 9px;
  }

  .frame {
    flex: 1;
    background: var(--accent);
    border: 3px solid var(--ink);
    position: relative;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 5px;
    background: var(--yellow);
  }

  .scanline {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 4px;
    background: var(--accent);
    opacity: .75;
    animation: scan 3s steps(8) infinite;
  }

  @keyframes scan {
    0%, 100% { top: 28%; }
    50% { top: 72%; }
  }

  .blink {
    animation: blink 1.2s steps(2) infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    46%, 100% { opacity: .35; }
  }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .screen { min-height: 100dvh; padding: 56px 18px 50px; }
    .corner { font-size: 7px; }
    .corner.tl, .corner.tr { top: 20px; }
    .corner.tl, .corner.bl { left: 18px; }
    .corner.tr, .corner.br { right: 18px; }
    .corner.bl, .corner.br { bottom: 18px; }
    .card {
      grid-template-columns: 1fr;
      gap: 18px;
      border-width: 6px;
      box-shadow: 8px 8px 0 var(--ink), 14px 14px 0 var(--shadow);
    }
    .camera-stage { min-height: 250px; }
    .camera { transform: scale(.82); }
    h1 { font-size: clamp(28px, 10vw, 48px); }
    .sub { font-size: 9px; line-height: 2.1; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="corner tl">CAM_01<br>READY</div>
    <div class="corner tr">D.TREGO<br><span class="blink">● REC</span></div>
    <div class="corner bl">ISO 800<br>PIXEL / FILM</div>
    <div class="corner br">2026<br>LOADING...</div>

    <section class="card" aria-label="Daniel Trego photography site coming soon">
      <div class="copy">
        <div class="eyebrow">PHOTO PORTFOLIO // INSERT COIN</div>
        <h1>Daniel<br>Trego</h1>
        <p class="sub">A new collection of photographs is being developed.<br><br>FRAME BY FRAME. STORY BY STORY.</p>
        <a class="instagram" href="https://www.instagram.com/tregodan/" target="_blank" rel="noopener noreferrer" aria-label="Open Daniel Trego on Instagram">
          <span class="ig-mark" aria-hidden="true"></span>
          @TREGODAN
        </a>
      </div>

      <div class="camera-stage" aria-hidden="true">
        <div class="camera">
          <div class="top"></div>
          <div class="shutter"></div>
          <div class="camera-body"></div>
          <div class="lens"></div>
          <div class="film">
            <span class="frame"></span>
            <span class="frame"></span>
            <span class="frame"></span>
            <span class="frame"></span>
          </div>
        </div>
        <div class="scanline"></div>
      </div>
    </section>
  </main>
</body>
</html>
